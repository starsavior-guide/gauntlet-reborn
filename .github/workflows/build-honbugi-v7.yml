name: Build Honbugi V7 Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ honbugi-v7-build ]

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  SOURCE_FILE_ID: "1iDaVwJ2V2tuetRWWr5sDuvEhNOZN5S7X"
  V7_PYTHON: "/opt/v7venv/bin/python"

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python toolchain and helpers
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 python3-pip python3-venv unzip xz-utils ca-certificates
          python3 -m venv /opt/v7venv
          /opt/v7venv/bin/pip install --disable-pip-version-check --no-cache-dir pillow gdown
          "$V7_PYTHON" --version

      - name: Reconstruct V7 text project
        shell: bash
        run: |
          cat ci/v7_payload.*.b64 | base64 -d > /tmp/v7_text_payload.tar.xz
          echo "2e84a8606ef015c6c46715ee6b7ea222e95377419dfc768c40451238b1b36a78  /tmp/v7_text_payload.tar.xz" | sha256sum -c -
          tar -xJf /tmp/v7_text_payload.tar.xz -C "$GITHUB_WORKSPACE"

      - name: Download creator-published original game
        shell: bash
        run: |
          mkdir -p source
          "$V7_PYTHON" -m gdown "$SOURCE_FILE_ID" -O source/honbugi-original.zip
          test -s source/honbugi-original.zip
          unzip -q source/honbugi-original.zip -d source
          test -f source/hongbuki/Resources/data/project.json

      - name: Rebuild source-backed PNG and OGG assets
        shell: bash
        run: |
          "$V7_PYTHON" ci/rebuild_assets_v7.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/source/hongbuki/Resources"

      - name: Install Godot templates and Android editor settings
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          cp -a /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          cp -a /root/.config/godot/. ~/.config/godot/

      - name: V7 preflight
        shell: bash
        run: |
          "$V7_PYTHON" tools/preflight_v7.py

      - name: Import and parse project
        shell: bash
        run: godot --headless --verbose --path "$GITHUB_WORKSPACE" --editor --quit

      - name: Build Android Debug APK
        shell: bash
        run: |
          mkdir -p build
          godot --headless --verbose --path "$GITHUB_WORKSPACE" --export-debug "Android" "$GITHUB_WORKSPACE/build/HonbugiV7.apk"
          test -s build/HonbugiV7.apk
          sha256sum build/HonbugiV7.apk | tee build/HonbugiV7.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HonbugiV7-Android-Debug
          path: |
            build/HonbugiV7.apk
            build/HonbugiV7.apk.sha256
          if-no-files-found: error
