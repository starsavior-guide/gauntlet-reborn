name: Build Honbugi V11 Manual Pivot Android APK

on:
  workflow_dispatch:
  push:
    branches: [ honbugi-v11-build ]

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  V7_ZIP_URL: "https://raw.githubusercontent.com/starsavior-guide/gauntlet-reborn/main/honbugi_android_port_v7.zip"
  V9_BUNDLE_URL: "https://raw.githubusercontent.com/starsavior-guide/gauntlet-reborn/main/player_v9_bundle.zip"

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout V11 build branch
        uses: actions/checkout@v4

      - name: Install build helpers
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 python3-pil unzip curl ca-certificates coreutils
          python3 --version

      - name: Download and unpack V7 base
        shell: bash
        run: |
          rm -rf /tmp/honbugi_v7 /tmp/honbugi_v7.zip
          mkdir -p /tmp/honbugi_v7
          curl -L --fail --retry 3 --retry-delay 2 "$V7_ZIP_URL" -o /tmp/honbugi_v7.zip
          test -s /tmp/honbugi_v7.zip
          unzip -q /tmp/honbugi_v7.zip -d /tmp/honbugi_v7
          test -f /tmp/honbugi_v7/honbugi_android_port_v7/project.godot
          cp -a /tmp/honbugi_v7/honbugi_android_port_v7/. "$GITHUB_WORKSPACE"/
          test -f project.godot
          test -f scripts/game.gd

      - name: Restore V8 gameplay baseline
        shell: bash
        run: |
          python3 patches/v8_part1.py
          python3 patches/v8_part2.py
          python3 patches/v8_part3.py
          grep -n 'Android Test V8' scripts/game.gd
          grep -n 'TEST_MAX_HP' scripts/game.gd

      - name: Download V9 character source frames only
        shell: bash
        run: |
          rm -rf /tmp/player_v9_bundle.zip assets/player_v9
          curl -L --fail --retry 3 --retry-delay 2 "$V9_BUNDLE_URL" -o /tmp/player_v9_bundle.zip
          test -s /tmp/player_v9_bundle.zip
          unzip -q /tmp/player_v9_bundle.zip 'assets/player_v9/*' -d "$GITHUB_WORKSPACE"
          test -d assets/player_v9
          echo "source V9 frames: $(find assets/player_v9 -type f -name '*.webp' | wc -l)"

      - name: Restore V10 simplified controls
        shell: bash
        run: |
          python3 tools/make_v10_simple.py
          python3 patches/v10_simple.py
          grep -n 'Android Test V10' scripts/game.gd
          if grep -q '"STR"' scripts/game.gd || grep -q 'strong_attack' scripts/game.gd; then
            echo 'Skill/STR code still present after V10 simplification'
            exit 92
          fi

      - name: Build V11 manual-pivot character frames
        shell: bash
        run: |
          python3 tools/make_v11_manual.py
          python3 patches/v11_manual.py
          echo "V11 png count: $(find assets/player_v11 -type f -name '*.png' | wc -l)"
          grep -n 'player_v11_animations.json' scripts/game.gd
          grep -n 'Android Test V11' scripts/game.gd
          grep -n 'player.z_index = 20' scripts/game.gd
          if grep -q '"STR"' scripts/game.gd || grep -q 'strong_attack' scripts/game.gd; then
            echo 'Skill/STR code unexpectedly present in V11'
            exit 93
          fi

      - name: Validate V11 sprite canvases and pivots
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          files = sorted(Path('assets/player_v11').glob('*/*.png'))
          if len(files) != 24:
              raise SystemExit(f'Expected 24 V11 PNG frames, got {len(files)}')
          for p in files:
              im = Image.open(p).convert('RGBA')
              if im.size != (512,512):
                  raise SystemExit(f'Bad canvas {p}: {im.size}')
              b = im.getchannel('A').getbbox()
              if not b:
                  raise SystemExit(f'Empty frame {p}')
              if b[0] <= 8 or b[2] >= 504 or b[1] <= 8 or b[3] >= 504:
                  raise SystemExit(f'Frame too close to canvas edge {p}: {b}')
              # Every authored V11 frame is intentionally pinned to ground Y=400.
              if b[3] - 1 != 400:
                  raise SystemExit(f'Ground baseline mismatch {p}: {b}')
              if b[3] - b[1] > 190:
                  raise SystemExit(f'Frame too tall {p}: {b}')
          print('V11 sprite canvas/pivot validation OK:', len(files))
          PY

      - name: Enable Android ETC2 ASTC texture import
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('project.godot')
          s = p.read_text(encoding='utf-8')
          key = 'textures/vram_compression/import_etc2_astc=true'
          if key not in s:
              marker = '[rendering]\n'
              if marker not in s:
                  raise SystemExit('Missing [rendering] section')
              s = s.replace(marker, marker + key + '\n', 1)
              p.write_text(s, encoding='utf-8')
          print(key)
          PY

      - name: Install Godot templates and Android editor settings
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          cp -a /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          cp -a /root/.config/godot/. ~/.config/godot/

      - name: Static preflight
        shell: bash
        run: |
          python3 tools/preflight_v7.py

      - name: Import and parse project
        shell: bash
        run: |
          godot --headless --verbose --path "$GITHUB_WORKSPACE" --editor --quit

      - name: Runtime smoke test
        shell: bash
        run: |
          mkdir -p build
          set +e
          timeout 10s godot --headless --verbose --path "$GITHUB_WORKSPACE" > build/runtime-smoke.log 2>&1
          code=$?
          set -e
          echo "===== runtime smoke exit code: $code ====="
          tail -n 320 build/runtime-smoke.log || true
          grep -Ein 'SCRIPT ERROR|ERROR:|Invalid|Attempt to call|Nil|Null|Parser Error|Cannot|failed|not found' build/runtime-smoke.log | tail -n 260 || true
          if grep -Eiq 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid get index|Attempt to call' build/runtime-smoke.log; then
            echo 'Fatal runtime/script error detected by smoke test.'
            exit 91
          fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            exit "$code"
          fi

      - name: Build Android Debug APK
        shell: bash
        run: |
          mkdir -p build
          set +e
          godot --headless --verbose --path "$GITHUB_WORKSPACE" --export-debug "Android" "$GITHUB_WORKSPACE/build/HonbugiV11-Manual.apk" > build/android-export.log 2>&1
          code=$?
          set -e
          echo "===== Godot Android export exit code: $code ====="
          tail -n 240 build/android-export.log || true
          grep -Ein 'error|failed|failure|missing|invalid|keystore|android|sdk|template|gradle|jarsigner|apksigner|etc2|astc' build/android-export.log | tail -n 180 || true
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          test -s build/HonbugiV11-Manual.apk
          sha256sum build/HonbugiV11-Manual.apk | tee build/HonbugiV11-Manual.apk.sha256

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HonbugiV11-Diagnostics
          path: |
            build/runtime-smoke.log
            build/android-export.log
          if-no-files-found: warn

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HonbugiV11-Manual-Android
          path: |
            build/HonbugiV11-Manual.apk
            build/HonbugiV11-Manual.apk.sha256
          if-no-files-found: error
