name: Build Honbugi V7 Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ honbugi-v7-build ]

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  V7_ZIP_URL: "https://raw.githubusercontent.com/starsavior-guide/gauntlet-reborn/main/honbugi_android_port_v7.zip"

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Install build helpers
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 unzip curl ca-certificates coreutils
          python3 --version

      - name: Download and unpack uploaded V7 ZIP
        shell: bash
        run: |
          rm -rf /tmp/honbugi_v7 /tmp/honbugi_v7.zip
          mkdir -p /tmp/honbugi_v7
          curl -L --fail --retry 3 --retry-delay 2 "$V7_ZIP_URL" -o /tmp/honbugi_v7.zip
          test -s /tmp/honbugi_v7.zip
          unzip -q /tmp/honbugi_v7.zip -d /tmp/honbugi_v7
          test -f /tmp/honbugi_v7/honbugi_android_port_v7/project.godot
          cp -a /tmp/honbugi_v7/honbugi_android_port_v7/. "$GITHUB_WORKSPACE"/
          test -f "$GITHUB_WORKSPACE/project.godot"
          test -f "$GITHUB_WORKSPACE/export_presets.cfg"

      - name: Enable Android ETC2 ASTC texture import
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('project.godot')
          s = p.read_text(encoding='utf-8')
          key = 'textures/vram_compression/import_etc2_astc=true'
          if key not in s:
              marker = '[rendering]\n'
              if marker not in s:
                  raise SystemExit('Missing [rendering] section in project.godot')
              s = s.replace(marker, marker + key + '\n', 1)
              p.write_text(s, encoding='utf-8')
          print('Android texture compression setting:')
          for line in p.read_text(encoding='utf-8').splitlines():
              if 'vram_compression' in line:
                  print(line)
          PY

      - name: Install Godot templates and Android editor settings
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          cp -a /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          cp -a /root/.config/godot/. ~/.config/godot/

      - name: V7 preflight
        shell: bash
        run: |
          python3 tools/preflight_v7.py

      - name: Import and parse project
        shell: bash
        run: |
          godot --headless --verbose --path "$GITHUB_WORKSPACE" --editor --quit

      - name: Runtime smoke test
        shell: bash
        run: |
          mkdir -p build
          set +e
          timeout 8s godot --headless --verbose --path "$GITHUB_WORKSPACE" > build/runtime-smoke.log 2>&1
          code=$?
          set -e
          echo "===== runtime smoke exit code: $code ====="
          tail -n 260 build/runtime-smoke.log || true
          echo "===== runtime error lines ====="
          grep -Ein 'SCRIPT ERROR|ERROR:|Invalid|Attempt to call|Nil|Null|Parser Error|Cannot|failed|not found' build/runtime-smoke.log | tail -n 220 || true
          # timeout(124) is expected because the game loop keeps running.
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "Unexpected Godot runtime exit code $code"
          fi

      - name: Build Android Debug APK
        shell: bash
        run: |
          mkdir -p build
          set +e
          godot --headless --verbose --path "$GITHUB_WORKSPACE" --export-debug "Android" "$GITHUB_WORKSPACE/build/HonbugiV7.apk" > build/android-export.log 2>&1
          code=$?
          set -e
          echo "===== Godot Android export exit code: $code ====="
          echo "===== android-export.log tail ====="
          tail -n 220 build/android-export.log || true
          echo "===== likely error lines ====="
          grep -Ein 'error|failed|failure|missing|invalid|keystore|android|sdk|template|gradle|jarsigner|apksigner|etc2|astc' build/android-export.log | tail -n 160 || true
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          test -s build/HonbugiV7.apk
          sha256sum build/HonbugiV7.apk | tee build/HonbugiV7.apk.sha256

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HonbugiV7-Diagnostics
          path: |
            build/runtime-smoke.log
            build/android-export.log
          if-no-files-found: warn

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HonbugiV7-Android-Debug
          path: |
            build/HonbugiV7.apk
            build/HonbugiV7.apk.sha256
          if-no-files-found: error
