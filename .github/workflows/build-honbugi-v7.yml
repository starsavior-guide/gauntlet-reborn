name: Build Honbugi V9 Character Test APK

on:
  workflow_dispatch:
  push:
    branches: [ honbugi-v7-build ]

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  V7_ZIP_URL: "https://raw.githubusercontent.com/starsavior-guide/gauntlet-reborn/main/honbugi_android_port_v7.zip"
  V9_BUNDLE_URL: "https://raw.githubusercontent.com/starsavior-guide/gauntlet-reborn/main/player_v9_bundle.zip"

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Install build helpers
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 unzip curl ca-certificates coreutils
          python3 --version

      - name: Download and unpack V7 base
        shell: bash
        run: |
          rm -rf /tmp/honbugi_v7 /tmp/honbugi_v7.zip
          mkdir -p /tmp/honbugi_v7
          curl -L --fail --retry 3 --retry-delay 2 "$V7_ZIP_URL" -o /tmp/honbugi_v7.zip
          test -s /tmp/honbugi_v7.zip
          unzip -q /tmp/honbugi_v7.zip -d /tmp/honbugi_v7
          test -f /tmp/honbugi_v7/honbugi_android_port_v7/project.godot
          cp -a /tmp/honbugi_v7/honbugi_android_port_v7/. "$GITHUB_WORKSPACE"/
          test -f "$GITHUB_WORKSPACE/project.godot"
          test -f "$GITHUB_WORKSPACE/export_presets.cfg"

      - name: Download and apply V9 character bundle
        shell: bash
        run: |
          rm -rf /tmp/player_v9_bundle /tmp/player_v9_bundle.zip
          mkdir -p /tmp/player_v9_bundle
          curl -L --fail --retry 3 --retry-delay 2 "$V9_BUNDLE_URL" -o /tmp/player_v9_bundle.zip
          test -s /tmp/player_v9_bundle.zip
          unzip -q /tmp/player_v9_bundle.zip -d /tmp/player_v9_bundle
          test -f /tmp/player_v9_bundle/scripts/game.gd
          test -f /tmp/player_v9_bundle/data/player_v9_animations.json
          test -d /tmp/player_v9_bundle/assets/player_v9
          cp -a /tmp/player_v9_bundle/. "$GITHUB_WORKSPACE"/
          echo "V9 WebP frame count: $(find assets/player_v9 -type f -name '*.webp' | wc -l)"
          test "$(find assets/player_v9 -type f -name '*.webp' | wc -l)" -ge 60
          grep -n 'Android Test V9' scripts/game.gd
          grep -n 'player_v9_animations.json' scripts/game.gd
          grep -n 'SKILL' scripts/game.gd
          sha256sum scripts/game.gd data/player_v9_animations.json

      - name: Enable Android ETC2 ASTC texture import
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('project.godot')
          s = p.read_text(encoding='utf-8')
          key = 'textures/vram_compression/import_etc2_astc=true'
          if key not in s:
              marker = '[rendering]\n'
              if marker not in s:
                  raise SystemExit('Missing [rendering] section in project.godot')
              s = s.replace(marker, marker + key + '\n', 1)
              p.write_text(s, encoding='utf-8')
          for line in p.read_text(encoding='utf-8').splitlines():
              if 'vram_compression' in line:
                  print(line)
          PY

      - name: Install Godot templates and Android editor settings
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          cp -a /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          cp -a /root/.config/godot/. ~/.config/godot/

      - name: Static preflight
        shell: bash
        run: |
          python3 tools/preflight_v7.py

      - name: Import and parse project
        shell: bash
        run: |
          godot --headless --verbose --path "$GITHUB_WORKSPACE" --editor --quit

      - name: Runtime smoke test
        shell: bash
        run: |
          mkdir -p build
          set +e
          timeout 10s godot --headless --verbose --path "$GITHUB_WORKSPACE" > build/runtime-smoke.log 2>&1
          code=$?
          set -e
          echo "===== runtime smoke exit code: $code ====="
          tail -n 320 build/runtime-smoke.log || true
          echo "===== runtime error lines ====="
          grep -Ein 'SCRIPT ERROR|ERROR:|Invalid|Attempt to call|Nil|Null|Parser Error|Cannot|failed|not found' build/runtime-smoke.log | tail -n 260 || true
          if grep -Eiq 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid get index|Attempt to call' build/runtime-smoke.log; then
            echo 'Fatal runtime/script error detected by smoke test.'
            exit 91
          fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "Unexpected Godot runtime exit code $code"
            exit "$code"
          fi

      - name: Build Android Debug APK
        shell: bash
        run: |
          mkdir -p build
          set +e
          godot --headless --verbose --path "$GITHUB_WORKSPACE" --export-debug "Android" "$GITHUB_WORKSPACE/build/HonbugiV9-Character-Test.apk" > build/android-export.log 2>&1
          code=$?
          set -e
          echo "===== Godot Android export exit code: $code ====="
          tail -n 240 build/android-export.log || true
          echo "===== likely error lines ====="
          grep -Ein 'error|failed|failure|missing|invalid|keystore|android|sdk|template|gradle|jarsigner|apksigner|etc2|astc' build/android-export.log | tail -n 180 || true
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          test -s build/HonbugiV9-Character-Test.apk
          sha256sum build/HonbugiV9-Character-Test.apk | tee build/HonbugiV9-Character-Test.apk.sha256

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HonbugiV9-Diagnostics
          path: |
            build/runtime-smoke.log
            build/android-export.log
          if-no-files-found: warn

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HonbugiV9-Character-Test-Android
          path: |
            build/HonbugiV9-Character-Test.apk
            build/HonbugiV9-Character-Test.apk.sha256
          if-no-files-found: error
